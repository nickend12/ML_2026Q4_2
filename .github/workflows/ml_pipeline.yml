name: Pipeline ML EA2 - Unidad 1

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  evaluar-modelos:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3. Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 4. Ejecutar notebook completo
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1800 \
            src/clases_po/reportes/actividad_modelos.ipynb

      - name: 5. Publicar resumen_modelos.txt como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resumen-evaluacion-modelos
          path: resumen_modelos.txt